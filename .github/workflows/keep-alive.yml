name: Keep Supabase + Bot Alive

on:
  schedule:
    - cron: '*/12 * * * *'   # every 12 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # 1. Keep Supabase awake
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase..."
          curl -fsS --retry 3 --retry-delay 5 \
            "${SUPABASE_URL}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
          echo "Supabase ping successful"

      # 2. Keep the Telegram bot awake (prevents cold starts)
      - name: Ping Telegram bot
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
        run: |
          if [ -z "$BOT_URL" ]; then
            echo "BOT_URL secret is missing – skipping bot ping"
            exit 0
          fi
          echo "Pinging bot..."
          curl -fsS --retry 3 --retry-delay 5 \
            -X GET "$BOT_URL" \
            -H "User-Agent: GitHub-KeepAlive" \
            --max-time 15
          echo "Bot ping successful"
