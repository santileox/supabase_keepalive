name: Keep Multiple Bots + Supabase Alive

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:

      # ==================== BOT 1 ====================
      - name: Ping Bot 1 - Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "Bot 1 Supabase secrets missing – skipping"
            exit 0
          fi
          echo "Pinging Bot 1 Supabase..."
          curl -fsS --retry 3 --retry-delay 5 \
            "${SUPABASE_URL}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
          echo "Bot 1 Supabase ping successful"

      - name: Ping Bot 1 - Webhook
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
        run: |
          if [ -z "$BOT_URL" ]; then
            echo "BOT_URL missing – skipping"
            exit 0
          fi
          echo "Pinging Bot 1 webhook..."
          curl -sS --retry 4 --retry-delay 8 --max-time 40 \
            -X GET "$BOT_URL" \
            -H "User-Agent: GitHub-KeepAlive" || true
          echo "Bot 1 webhook ping finished"

      # ==================== BOT 2 ====================
      - name: Ping Bot 2 - Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_2 }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_2 }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "Bot 2 Supabase secrets missing – skipping"
            exit 0
          fi
          echo "Pinging Bot 2 Supabase..."
          curl -fsS --retry 3 --retry-delay 5 \
            "${SUPABASE_URL}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
          echo "Bot 2 Supabase ping successful"

      - name: Ping Bot 2 - Webhook
        env:
          BOT_URL: ${{ secrets.BOT_URL_2 }}
        run: |
          if [ -z "$BOT_URL" ]; then
            echo "BOT_URL_2 missing – skipping"
            exit 0
          fi
          echo "Pinging Bot 2 webhook..."
          curl -sS --retry 4 --retry-delay 8 --max-time 40 \
            -X GET "$BOT_URL" \
            -H "User-Agent: GitHub-KeepAlive" || true
          echo "Bot 2 webhook ping finished"

      # ==================== BOT 3 ====================
      - name: Ping Bot 3 - Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_3 }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_3 }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "Bot 3 Supabase secrets missing – skipping"
            exit 0
          fi
          echo "Pinging Bot 3 Supabase..."
          curl -fsS --retry 3 --retry-delay 5 \
            "${SUPABASE_URL}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
          echo "Bot 3 Supabase ping successful"

      - name: Ping Bot 3 - Webhook
        env:
          BOT_URL: ${{ secrets.BOT_URL_3 }}
        run: |
          if [ -z "$BOT_URL" ]; then
            echo "BOT_URL_3 missing – skipping"
            exit 0
          fi
          echo "Pinging Bot 3 webhook..."
          curl -sS --retry 4 --retry-delay 8 --max-time 40 \
            -X GET "$BOT_URL" \
            -H "User-Agent: GitHub-KeepAlive" || true
          echo "Bot 3 webhook ping finished"
